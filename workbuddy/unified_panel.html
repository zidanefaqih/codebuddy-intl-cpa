function renderTrae(){if(traeLoading)return;$('traeBody').innerHTML=traeAccounts.length?traeAccounts.map(a=>'<tr><td><div class="name">'+esc(a.name||a.uid)+'</div><div class="sub">'+esc(a.uid)+'</div></td><td><span class="status '+(a.error?'bad':a.disabled?'off':'')+'">'+esc(a.error||t(a.disabled?'disabled':'enabled'))+'</span></td><td class="num">'+esc(a.remain??'—')+'</td><td class="num">'+esc(a.used??'—')+'</td><td>'+esc(t(a.checked_in?'done':a.checkin_enabled?'pending':'unavailable'))+'</td><td class="num"><button data-models="'+esc(a.auth_index)+'">'+esc(t('models'))+'</button> <button data-toggle="'+esc(a.auth_index)+'" data-enabled="'+String(a.disabled)+'">'+esc(t(a.disabled?'enable':'disable'))+'</button> <button data-checkin="'+esc(a.auth_index)+'" '+(a.disabled||a.checked_in?'disabled':'')+'>'+esc(t('checkin'))+'</button></td></tr>').join(''):emptyRow(6,t('noAccounts'));syncPending()}
async function loadUsage(){$('usageBody').innerHTML=emptyRow(9,t('loading'));try{const d=await api('/combined/usage?limit=300');usageRecords=d.records||[];renderUsage()}catch(e){$('usageBody').innerHTML=emptyRow(9,e.message)}}
function renderUsage(){const filter=$('usageChannel').value,rows=usageRecords.filter(r=>filter==='all'||(r.channel||(r.region==='trae'?'trae':'codebuddy'))===filter);$('usageBody').innerHTML=rows.length?rows.map(r=>'<tr><td>'+esc(new Date(r.timestamp).toLocaleString(lang))+'</td><td>'+(r.channel==='trae'||r.region==='trae'?'Trae':'CodeBuddy')+'</td><td>'+esc(r.nickname||r.auth_index)+'</td><td><code>'+esc(r.model)+'</code></td><td class="num">'+esc(r.input_tokens||0)+'</td><td class="num">'+esc(r.output_tokens||0)+'</td><td class="num">'+esc(r.cache_read_tokens||0)+'</td><td class="num">'+esc(r.credit||0)+'</td><td class="status '+(r.failed?'bad':'')+'">'+esc(t(r.failed?'failed':'success'))+'</td></tr>').join(''):emptyRow(9,t('noUsage'));$('usageCount').textContent=rows.length+' '+t('usage')}
async function openModels(index){const generation=++modelGeneration;modelIndex=index;$('modelAccount').textContent=traeAccounts.find(a=>a.auth_index===index)?.name||index;$('modelSearch').value='';$('modelError').textContent='';catalog=[];disabledModels=new Set();$('modelsList').innerHTML='<div class="empty">'+esc(t('loading'))+'</div>';$('modelsDialog').showModal();$('saveModels').disabled=true;try{const d=await api('/trae/models?auth_index='+encodeURIComponent(index));if(!$('modelsDialog').open||modelIndex!==index||generation!==modelGeneration)return;catalog=d.models||[];disabledModels=new Set((d.disabled_models||[]).map(id=>id.replace(/^trae\//,'')));renderModels();$('saveModels').disabled=false}catch(e){$('modelError').textContent=e.message}}
function renderModels(){const q=$('modelSearch').value.toLowerCase(),rows=catalog.filter(m=>(m.ID||m.id||'').toLowerCase().includes(q));$('modelsList').innerHTML=rows.length?rows.map(m=>{const id=m.ID||m.id,short=id.replace(/^trae\//,'');return '<div class="model-row"><label><input type="checkbox" data-model="'+esc(short)+'" '+(disabledModels.has(short)?'':'checked')+'><code>'+esc(id)+'</code></label><span class="caption">'+esc(m.ContextLength||m.context_length||'')+'</span></div>'}).join(''):'<div class="empty">'+esc(t('noModels'))+'</div>';$('modelCount').textContent=(catalog.filter(m=>!disabledModels.has((m.ID||m.id).replace(/^trae\//,''))).length)+' / '+catalog.length+' '+t('enabled')}
function stopLogin(){if(loginTimer)clearInterval(loginTimer);loginTimer=null;loginState='';$('loginBox').hidden=true;$('callbackRaw').value=''}
async function startLogin(){stopLogin();const r=await api('/trae/login/start',{});loginState=r.State||r.state;const url=new URL(r.URL||r.url);if(url.protocol!=='https:')throw Error('Invalid login URL');$('loginURL').href=url.href;$('loginHelp').textContent=r.Metadata?.message||r.metadata?.message||'';$('loginBox').hidden=false;loginUntil=Date.now()+300000;loginTimer=setInterval(()=>{if(Date.now()>loginUntil){stopLogin();notify(t('loginExpired'),true);return}if(!document.hidden&&!authBlocked)pollLogin().catch(e=>{stopLogin();notify(e.message,true)})},3000);notify(t('loginReady'))}
async function pollLogin(){if(!loginState||loginPolling)return;loginPolling=true;try{const r=await api('/trae/login/poll',{State:loginState});if((r.Status||r.status)==='success'){stopLogin();notify(t('loginSuccess'));await loadTrae()}else if((r.Status||r.status)==='error'){stopLogin();throw Error(r.Message||r.message||t('loginExpired'))}}finally{loginPolling=false}}
$('panelLanguage').addEventListener('change',e=>setLanguage(e.target.value));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$('keyForm').addEventListener('submit',e=>{e.preventDefault();const k=$('keyInput').value.trim();if(!k)return;put(sessionStorage,SS_KEY,k);$('keyInput').value='';authBlocked=false;$('authBox').hidden=true;if($('codebuddyFrame').getAttribute('src'))$('codebuddyFrame').contentWindow.location.reload();switchTab(selectedTab)});
$('refreshOverview').addEventListener('click',e=>action(e.currentTarget,loadOverview));$('channelBody').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)switchTab(b.dataset.open)});
$('traeRefresh').addEventListener('click',e=>action(e.currentTarget,loadTrae));$('traeImport').addEventListener('click',()=>{$('importError').textContent='';$('importDialog').showModal()});$('traeLogin').addEventListener('click',e=>action(e.currentTarget,startLogin));$('traeCheckinAll').addEventListener('click',e=>action(e.currentTarget,async()=>{const r=await api('/trae/checkin',{}),errors=(r.results||[]).filter(x=>x.error);notify(errors.length?errors.map(x=>x.error).join('; '):t('done'),!!errors.length);await loadTrae()}));
$('traeBody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(pendingActions.has(actionKey(b)))return;if(b.dataset.models){openModels(b.dataset.models);return}if(b.dataset.toggle)action(b,async()=>{await api('/trae/toggle',{auth_index:b.dataset.toggle,enabled:b.dataset.enabled==='true'});await loadTrae()});if(b.dataset.checkin)action(b,async()=>{const r=await api('/trae/checkin',{auth_index:b.dataset.checkin}),error=(r.results||[]).find(x=>x.error);if(error)throw Error(error.error);notify(t('done'));await loadTrae()})});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.close==='modelsDialog'&&pendingActions.has('saveModels'))return;$(b.dataset.close).close()}));$('modelsDialog').addEventListener('cancel',e=>{if(pendingActions.has('saveModels'))e.preventDefault()});$('importForm').addEventListener('submit',e=>{e.preventDefault();action(e.submitter,async()=>{try{await api('/trae/import',JSON.parse($('importRaw').value));$('importRaw').value='';$('importDialog').close();notify(t('imported'));await loadTrae()}catch(error){$('importError').textContent=error.message;throw error}})});
$('modelSearch').addEventListener('input',renderModels);$('modelsList').addEventListener('change',e=>{const id=e.target.dataset.model;if(id){e.target.checked?disabledModels.delete(id):disabledModels.add(id);$('modelCount').textContent=(catalog.length-disabledModels.size)+' / '+catalog.length+' '+t('enabled')}});$('enableModels').addEventListener('click',()=>{disabledModels.clear();renderModels()});$('disableModels').addEventListener('click',()=>{disabledModels=new Set(catalog.map(m=>(m.ID||m.id).replace(/^trae\//,'')));renderModels()});$('saveModels').addEventListener('click',e=>action(e.currentTarget,async()=>{const r=await api('/trae/models/config',{auth_index:modelIndex,disabled_models:[...disabledModels]});notify(t(r.reload?.status==='failed'?'reloadFailed':'modelSaved'),r.reload?.status==='failed');$('modelsDialog').close()}));
$('submitCallback').addEventListener('click',e=>action(e.currentTarget,async()=>{await api('/trae/login/complete',{state:loginState,callback_url:$('callbackRaw').value});$('callbackRaw').value='';await pollLogin()}));$('pollLogin').addEventListener('click',e=>action(e.currentTarget,pollLogin));$('cancelLogin').addEventListener('click',stopLogin);$('refreshUsage').addEventListener('click',e=>action(e.currentTarget,loadUsage));$('usageChannel').addEventListener('change',renderUsage);window.addEventListener('pagehide',stopLogin);
$('codebuddyFrame').addEventListener('load',()=>{try{$('codebuddyFrame').contentWindow.setPanelLanguage?.(lang)}catch(_){}});
function syncTheme(){let next;try{const theme=window.parent.document.documentElement.getAttribute('data-theme');next=theme==='dark'||(!theme&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'}catch(_){next=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}if(document.documentElement.dataset.theme!==next)document.documentElement.dataset.theme=next}
syncTheme();try{new MutationObserver(syncTheme).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(_){};matchMedia('(prefers-color-scheme:dark)').addEventListener('change',syncTheme);
const inherited=panelKey();if(inherited)put(sessionStorage,SS_KEY,inherited);try{const u=new URL(location.href),k=u.searchParams.get('key');if(k){put(sessionStorage,SS_KEY,k);u.searchParams.delete('key');history.replaceState(null,'',u)}}catch(_){}
translate();if(getKey())loadOverview();else{$('authBox').hidden=false;$('metrics').innerHTML='<div class="empty">'+esc(t('keyRequired'))+'</div>'}
</script></body></html>
